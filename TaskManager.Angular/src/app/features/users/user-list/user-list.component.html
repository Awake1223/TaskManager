<div class="toolbar">
  <h2>Пользователи</h2>
  <div class="spacer"></div>
  <input type="text"
         placeholder="Поиск по имени или email..."
         [value]="search"
         (input)="onSearch($any($event.target).value)" />
  <button type="button" class="primary" (click)="openCreate()">+ Пользователь</button>
</div>

<div class="error" *ngIf="error">{{ error }}</div>

<div *ngIf="loading">Загрузка...</div>

<table class="data-table" *ngIf="!loading">
  <thead>
    <tr>
      <th>Email</th>
      <th>Имя</th>
      <th>Фамилия</th>
      <th>Создан</th>
      <th style="width: 150px;">Действия</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let u of users">
      <td>{{ u.email }}</td>
      <td>{{ u.firstName }}</td>
      <td>{{ u.lastName }}</td>
      <td>{{ u.createdAt | date:'dd.MM.yyyy HH:mm' }}</td>
      <td>
        <button type="button" class="danger" (click)="delete(u)">Удалить</button>
      </td>
    </tr>
    <tr *ngIf="users.length === 0">
      <td colspan="5" style="text-align:center;color:#888;">Пользователей нет</td>
    </tr>
  </tbody>
</table>

<app-paginator [page]="page"
               [pageSize]="pageSize"
               [totalCount]="totalCount"
               (pageChange)="onPageChange($event)">
</app-paginator>

<app-user-form *ngIf="showForm"
               (saved)="onFormSaved()"
               (cancelled)="onFormCancelled()">
</app-user-form>
